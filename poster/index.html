<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Póster Disco Carsystem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Póster de una vista: el disco de freno es el índice; cada sector abre una sección y la pinza marca dónde estás. */
:root {
  color-scheme: dark;
  --fondo: #0a0e13; --lienzo: #0f151c; --sup: #161e27; --sup-2: #1f2933; --linea: #2b3644;
  --texto: #eff4f9; --tenue: #9aa8b8; --volt: #c8f31d; --volt-osc: #16200a; --naranja: #ff8a4c;
  --titulo: "Sora", "Inter", "Segoe UI", system-ui, sans-serif;
  --cuerpo: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 400 15px/1.5 var(--cuerpo); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--titulo); font-weight: 600; letter-spacing: -.02em; line-height: 1.14; text-wrap: balance; }
h1 { font-size: clamp(1.45rem, 2.5vw, 2.15rem); font-weight: 700; letter-spacing: -.03em; }
h2 { font-size: clamp(1.4rem, 2.3vw, 1.95rem); }
h3 { font-size: 1rem; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
.poster { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; }
.izq { display: flex; flex-direction: column; gap: 8px; min-height: 0; align-items: center; }
.encab { width: 100%; }
.encab p { color: var(--tenue); font-size: .84rem; margin-bottom: 4px; }
.disco-caja { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
#disco { height: 100%; width: 100%; max-height: 100%; display: block; }
#rotor, #pinza { transform-origin: 220px 220px; transition: transform .7s cubic-bezier(.3, .8, .25, 1); }
.sector { cursor: pointer; outline: none; }
.sector .zona { fill: transparent; stroke: rgba(10, 14, 19, .32); stroke-width: 1; transition: fill .2s; }
.sector:hover .zona { fill: rgba(255, 255, 255, .13); }
.sector.on .zona { fill: rgba(200, 243, 29, .24); }
.sector:focus-visible .zona { stroke: var(--volt); stroke-width: 2.5; }
.etiqueta { pointer-events: none; }
.etiqueta rect { fill: rgba(10, 14, 19, .86); transition: fill .2s; }
.etiqueta text { fill: var(--texto); font: 600 12.5px var(--cuerpo); text-anchor: middle; }
.etiqueta.on rect { fill: var(--volt); }
.etiqueta.on text { fill: var(--volt-osc); }
#luz { mix-blend-mode: overlay; pointer-events: none; }
#pinza { filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .55)); }
#cifra { fill: var(--texto); font: 700 25px var(--titulo); text-anchor: middle; letter-spacing: -.5px; }
#cifraSub { fill: #b4bfcb; font: 500 9.5px var(--cuerpo); text-anchor: middle; }
.panel { background: var(--lienzo); border-radius: 18px; min-height: 0; display: flex; flex-direction: column; }
.panel-barra { display: flex; align-items: center; gap: 6px; padding: 11px 14px 0; }
.ruta { color: var(--tenue); font-size: .84rem; margin-right: auto; font-variant-numeric: tabular-nums; }
.bt { background: var(--sup); border: 0; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: .85rem; color: var(--texto); text-decoration: none; display: inline-block; white-space: nowrap; }
.bt:hover { background: var(--sup-2); }
.bt.on, .bt.pri { background: var(--volt); color: var(--volt-osc); }
.bt:disabled { opacity: .4; cursor: default; }
.contenido { padding: 14px clamp(16px, 2.2vw, 26px) 20px; overflow-y: auto; flex: 1; min-height: 0; }
.vista { animation: entra .3s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.notas { background: var(--sup); border-radius: 12px; margin: 0 14px 14px; padding: 10px 13px; font-size: .9rem; max-height: 22vh; overflow-y: auto; }
.sub { color: var(--tenue); margin-top: 8px; max-width: 60ch; }
.ev { color: var(--tenue); font: 500 .74rem var(--mono); margin-top: 12px; }
.rej { display: grid; gap: 9px; margin-top: 14px; }
.r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.t { background: var(--sup); border: 0; border-radius: 13px; padding: 12px 13px; text-align: left; display: block; width: 100%; }
button.t:hover { background: var(--sup-2); }
.t[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--volt); }
.t .n { font: 700 clamp(1.35rem, 2.1vw, 1.8rem)/1.1 var(--titulo); letter-spacing: -.03em; display: block; font-variant-numeric: tabular-nums; }
.t .d { color: var(--tenue); font-size: .86rem; display: block; margin-top: 4px; }
.volt { color: var(--volt); } .nar { color: var(--naranja); }
.tabs { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 12px; }
.tab { background: none; border: 0; border-radius: 8px; padding: 5px 10px; font-size: .84rem; color: var(--tenue); font-weight: 600; }
.tab[aria-pressed="true"] { background: var(--sup-2); color: var(--texto); }
.graf { background: var(--fondo); border-radius: 13px; padding: 11px 11px 5px; margin-top: 13px; }
.leyenda { display: flex; gap: 12px; font-size: .82rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.leyenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
#g { width: 100%; height: clamp(180px, 38vh, 320px); display: block; touch-action: pan-y; margin-top: 4px; }
#g text { fill: var(--tenue); font: 500 11px var(--cuerpo); font-variant-numeric: tabular-nums; }
#g .tag text { fill: var(--volt-osc); font-weight: 700; }
.fila-b { margin-top: 10px; }
.fila-b div:first-child { display: flex; justify-content: space-between; font-size: .88rem; }
.pista { background: var(--sup-2); border-radius: 0 5px 5px 0; margin-top: 5px; }
.barrita { height: 12px; border-radius: 0 5px 5px 0; background: var(--volt); }
.barrita.b { background: var(--naranja); }
.chat { display: flex; flex-direction: column; gap: 5px; background: var(--fondo); border-radius: 13px; padding: 11px; margin-top: 12px; }
.msj { background: var(--sup); padding: 6px 10px; border-radius: 4px 12px 12px 12px; max-width: 88%; font-size: .86rem; }
.msj.a { align-self: flex-end; background: var(--sup-2); border-radius: 12px 4px 12px 12px; }
.msj small { display: block; color: var(--tenue); font-size: .7rem; }
.msj.clave { box-shadow: inset 0 0 0 1.5px var(--naranja); }
.flujo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 14px; }
.flujo div { background: var(--sup); border-radius: 10px; padding: 9px; font-size: .8rem; color: var(--tenue); }
.flujo b { display: block; color: var(--texto); font-size: .86rem; }
.flujo div:nth-child(3) { background: var(--volt); color: var(--volt-osc); }
.flujo div:nth-child(3) b { color: var(--volt-osc); }
.capas { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.capa { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--sup); border-radius: 11px; padding: 9px 12px; }
.capa b { color: var(--volt); font-size: .84rem; font-weight: 600; }
.capa div { display: flex; flex-wrap: wrap; gap: 4px; }
.capa span { background: var(--sup-2); border-radius: 7px; padding: 2px 8px; font-size: .84rem; }
.proto { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-top: 2px; }
.tel { height: min(470px, calc(100vh - 118px)); aspect-ratio: 503 / 1089; background: #000; border-radius: 22px; padding: 6px; box-shadow: 0 0 0 1.5px var(--linea); }
.pant { position: relative; height: 100%; border-radius: 17px; overflow: hidden; }
.pant img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.hot { position: absolute; background: rgba(200, 243, 29, .12); border: 2px solid var(--volt); border-radius: 9px; padding: 0; animation: pulso 1.6s infinite; }
@keyframes pulso { 50% { box-shadow: 0 0 0 6px rgba(200, 243, 29, .2); } }
.antes { background: var(--sup); border-radius: 11px; padding: 10px 12px; margin-top: 12px; font-size: .9rem; }
.antes b { color: var(--naranja); display: block; font-size: .75rem; font-weight: 600; }
.acciones { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-weight: 500; font-size: .75rem; color: var(--tenue); padding: 5px 10px 5px 0; }
td { border-top: 1px solid var(--linea); padding: 7px 10px 7px 0; vertical-align: top; }
.tabla { overflow-x: auto; margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.chip { background: var(--sup); border: 0; border-radius: 999px; padding: 5px 11px; font-size: .82rem; color: var(--tenue); }
.chip[aria-pressed="true"] { background: var(--volt); color: var(--volt-osc); font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--volt); margin-top: 6px; }
label { color: var(--tenue); font-size: .87rem; display: block; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .poster { height: auto; grid-template-columns: minmax(0, 1fr); }
  .disco-caja { flex: none; }
  #disco { height: auto; max-width: 440px; margin: 0 auto; }
  .contenido { overflow: visible; }
  .proto { grid-template-columns: minmax(0, 1fr); }
  .tel { height: auto; width: min(100%, 290px); margin: 4px auto 0; }
  .flujo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) { .r3, .r2 { grid-template-columns: minmax(0, 1fr); } #btnPresenta { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    </div>
    <div class="contenido" id="contenido" tabindex="-1"></div>
    <aside class="notas" id="notas" hidden></aside>
  </section>
</div>

    x.fillStyle = 'rgba(255,255,255,.5)'; x.beginPath(); x.arc(px + .5, py + .6, h + .55, 0, 7); x.fill();

  x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 1; x.beginPath(); x.arc(0, 0, 198.5, 0, 7); x.stroke();
  x.strokeStyle = 'rgba(0,0,0,.5)'; x.lineWidth = 1.5; x.beginPath(); x.arc(0, 0, 200, 0, 7); x.stroke();
  // Campana negra con pernos.
  x.fillStyle = 'rgba(0,0,0,.45)'; x.beginPath(); x.arc(0, 2, 95, 0, 7); x.fill();
  const hat = x.createRadialGradient(-22, -30, 10, 0, 0, 92);
  hat.addColorStop(0, '#34383d'); hat.addColorStop(.7, '#17191c'); hat.addColorStop(1, '#0b0c0e');
  x.fillStyle = hat; x.beginPath(); x.arc(0, 0, 92, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.2)'; x.lineWidth = 1; x.beginPath(); x.arc(0, 0, 91.5, 0, 7); x.stroke();
  x.strokeStyle = 'rgba(0,0,0,.8)'; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 64, 0, 7); x.stroke();
  for (let s = 0; s < N * 2; s++) { const a = (s * PASO / 2 + PASO / 4) * Math.PI / 180; perno(x, 78 * Math.cos(a), 78 * Math.sin(a), 5.2); }

}
function pintarLuz() {
  // Reflejos fijos: no giran con el disco, igual que la luz sobre el metal.
  const [c, x] = lienzo(880);
  const g = x.createConicGradient(-.5, 0, 0);
  [[0, .18], [.07, .95], [.15, .12], [.26, .34], [.38, .02], [.5, .22], [.57, .85], [.65, .1], [.78, .3], [.9, .03], [1, .18]].forEach(([p, a]) => g.addColorStop(p, `rgba(${a > .15 ? '255,255,255' : '0,0,0'},${a > .15 ? a : .5})`));
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, 200, 0, 7); x.arc(0, 0, 92, 0, 7, true); x.fill();
  return c.toDataURL('image/png');
}
function pinzaSVG() {
  const a = 28, curvo = (r1, r2, a0, a1, extra) => `<path d="${anillo(r1, r2, a0, a1)}" ${extra}/>`;
  const pernoP = (rad, ang) => { const [px, py] = pt(rad, ang); return `<circle cx="${px}" cy="${py}" r="4.6" fill="url(#plata)" stroke="#3b0408" stroke-width="1"/><circle cx="${px}" cy="${py}" r="1.7" fill="#2a2d31"/>`; };
  return `${curvo(153, 212, -a, a, 'fill="url(#rojo)" stroke="#a50d18" stroke-width="7" stroke-linejoin="round"')}${curvo(196, 206, -a + 3, a - 3, 'fill="#fff" opacity=".2"')}${curvo(176, 179, -a + 2, a - 2, 'fill="#58050a"')}${curvo(155, 161, -a + 3, a - 3, 'fill="#58050a" opacity=".55"')}${[-13, 13].map((d) => { const [px, py] = pt(166, d); return `<circle cx="${px}" cy="${py}" r="6.5" fill="#e0242f" stroke="#7c0810" stroke-width="1.2"/>`; }).join('')}${pernoP(190, -a + 5)}${pernoP(190, a - 5)}${pernoP(190, 0)}`;
}
function dibujarDisco() {
  const sectores = SEC.map((s, i) => {
    const m = i * PASO;
    return `<g class="sector" data-sec="${i}" role="button" tabindex="0" aria-label="${s.t}"><path class="zona" d="${anillo(92, 200, m - PASO / 2, m + PASO / 2)}"/></g>`;
  }).join('');
  const etiquetas = SEC.map((s, i) => {
    const [x, y] = pt(128, i * PASO), texto = `${i + 1}  ${s.t}`, w = texto.length * 7.1 + 18;
    return `<g class="etiqueta"><rect x="${x - w / 2}" y="${+y - 12}" width="${w}" height="24" rx="12"/><text x="${x}" y="${+y + 4.5}" xml:space="preserve">${texto}</text></g>`;
  }).join('');
  $('#disco').innerHTML = `<defs><radialGradient id="rojo" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#ff5146"/><stop offset=".5" stop-color="#d3121f"/><stop offset="1" stop-color="#7c0810"/></radialGradient><radialGradient id="plata" cx=".35" cy=".3"><stop offset="0" stop-color="#f3f5f7"/><stop offset="1" stop-color="#6d747b"/></radialGradient></defs><g id="rotor"><image href="${pintarRotor()}" width="440" height="440"/></g><image id="luz" href="${pintarLuz()}" width="440" height="440"/>${sectores}<circle cx="${C}" cy="${C}" r="58" fill="rgba(0,0,0,.5)" pointer-events="none"/><text id="cifra" x="${C}" y="${C + 5}"></text><text id="cifraSub" x="${C}" y="${C + 24}"></text><g id="pinza" pointer-events="none">${pinzaSVG()}</g>${etiquetas}`;
}
function pintar(reubicar = false) {
  const s = SEC[est.i];
  $('#contenido').innerHTML = `<div class="vista">${s.v()}</div>`;
  document.querySelectorAll('.sector').forEach((g, i) => { g.classList.toggle('on', i === est.i); g.setAttribute('aria-pressed', i === est.i); });
  document.querySelectorAll('.etiqueta').forEach((g, i) => g.classList.toggle('on', i === est.i));
  $('#rotor').style.transform = $('#pinza').style.transform = `rotate(${est.giro}deg)`;
  const [c, sub] = s.c();
  $('#cifra').textContent = c; $('#cifraSub').textContent = sub;
  $('#cifra').style.fontSize = c.length > 7 ? '17px' : c.length > 5 ? '21px' : '';
  $('#ruta').textContent = `${est.i + 1} de ${N} · ${s.t}`;
  $('#ant').disabled = est.i === 0; $('#sig').disabled = est.i === N - 1;
  $('#notas').textContent = s.n;
  s.d?.();
  if (reubicar) {
    $('#contenido').scrollTop = 0;
    try { history.replaceState(null, '', '#' + s.t.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '')); } catch (e) { /* opcional */ }
    if (innerWidth <= 900) $('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function ir(i) {
  i = Math.max(0, Math.min(N - 1, i));
  let d = ((i - est.i) % N + N) % N; if (d > N / 2) d -= N;
  est.giro += d * PASO; est.i = i; pintar(true);
}
document.addEventListener('click', (e) => {
  const g = e.target.closest('.sector'); if (g) return ir(+g.dataset.sec);
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.pant !== undefined) est.pant = +d.pant;
  else if (d.rango) est.rango = d.rango;
  else if (d.tab) est[d.tab] = +d.n;
  else if (d.area) { est.areas.has(d.area) ? est.areas.delete(d.area) : est.areas.add(d.area); try { localStorage.setItem('carsystem-areas', JSON.stringify([...est.areas])); } catch (x) { /* opcional */ } }
  else return;
  pintar();
});
document.addEventListener('input', (e) => { if (e.target.id === 'rec') { est.recupera = +e.target.value; pintar(); $('#rec').focus(); } });
$('#ant').onclick = () => ir(est.i - 1);
$('#sig').onclick = () => ir(est.i + 1);
const notas = () => { est.notas = !est.notas; $('#notas').hidden = !est.notas; $('#btnNotas').setAttribute('aria-pressed', est.notas); $('#btnNotas').classList.toggle('on', est.notas); grafico(); };
$('#btnNotas').onclick = notas;
$('#btnPresenta').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.()?.catch(() => {}); } catch (e) { /* opcional */ } };
document.addEventListener('keydown', (e) => {
  if (e.target.matches?.('input')) return;
  const g = e.target.closest?.('.sector');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return ir(+g.dataset.sec); }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); ir(est.i + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ir(est.i - 1); }
  if (/^[1-8]$/.test(e.key)) ir(+e.key - 1);
  if (e.key.toLowerCase() === 'n') notas();
});
try { const a = JSON.parse(localStorage.getItem('carsystem-areas')); if (Array.isArray(a)) est.areas = new Set(a); } catch (e) { /* opcional */ }
addEventListener('resize', grafico);
dibujarDisco();
const h = location.hash.slice(1);
est.i = Math.max(0, SEC.findIndex((s) => s.t.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '') === h));
est.giro = est.i * PASO;
pintar();
</script>
